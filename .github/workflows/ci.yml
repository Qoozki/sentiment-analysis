name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # torch/transformers are not needed: tests use a fake engine, and models load lazily.
      - run: pip install fastapi "uvicorn[standard]" python-multipart pandas openpyxl langdetect pytest httpx
      - run: pytest -q
